- main:
  - paragraph: The earning map
  - heading "How Henry Onyx earns" [level=1]
  - paragraph: Most platforms hide this page. We think that's the tell. Here is every way we make money, what you get in exchange, and the tests a fee must pass before it exists.
  - heading "The three tests" [level=2]
  - text: "01"
  - heading "You know what you're paying for" [level=3]
  - paragraph: No hidden fees, no surprise charges. If a fee applies, it's a named line item before you commit.
  - text: "02"
  - heading "You get more than it costs" [level=3]
  - paragraph: Every charge maps to something you value — and we can name it in one sentence.
  - text: "03"
  - heading "We'd publish the rate" [level=3]
  - paragraph: If we'd be uncomfortable seeing a rate in a screenshot on social media, the rate is wrong.
  - separator
  - heading "Division by division" [level=2]
  - paragraph: Mechanisms, not fine print. Where a division is still early, we say so — no fee turns on before its row appears here.
  - list:
    - listitem:
      - text: Henry Onyx Marketplace
      - paragraph: A commission on completed orders, and promoted placements always labeled as promoted. Verified sellers, payment protection, order tracking, and a real dispute process.
      - text: Live today
    - listitem:
      - text: Henry Onyx Fabric Care
      - paragraph: A platform fee on completed bookings, itemized at checkout. Vetted providers, honest pricing, rebooking with one tap, and support that answers.
      - text: Live today
    - listitem:
      - text: Henry Onyx Learn
      - paragraph: A revenue share with instructors on paid courses. Free previews before you pay, fair prices, and shareable certificates.
      - text: Live today
    - listitem:
      - text: Henry Onyx Studio
      - paragraph: A project fee on commissioned creative work. A shared workspace, milestone clarity, and payment held until delivery.
      - text: Live today
    - listitem:
      - text: Henry Onyx Jobs
      - paragraph: Employer-side tools and postings. Candidates never pay to apply. Real conversations with employers, application status you can see, interview scheduling.
      - text: Live today
    - listitem:
      - text: Henry Onyx Logistics
      - paragraph: A margin on each shipment, quoted up front — the price you see is the price. Up-front quotes, carrier transparency, and end-to-end tracking.
      - text: Live today
    - listitem:
      - text: Henry Onyx Property
      - paragraph: Listing and management tools for owners and managers. Verified listings and a documented inquiry trail.
      - text: Published before it turns on
  - heading "The platform fee, named" [level=2]
  - paragraph: "Where a platform fee applies, it appears as its own line at checkout — never buried in the total. It funds the things that make the ecosystem trustworthy: verification, dispute resolution, and 24/7 support. The same explanation appears in the fee tooltip at every checkout, because you shouldn't need this page to find it."
  - heading "See something that fails the tests?" [level=2]
  - paragraph: If any fee on Henry Onyx fails any of the three tests, it's misdesigned — tell us and we'll fix it. This page changes before pricing does, not after.
