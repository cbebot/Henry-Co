  - separator
  - heading "The spine they share" [level=2]
  - paragraph: The parts you feel everywhere, whichever division you use.
  - heading "One identity" [level=3]
  - paragraph: One account signs into every division. Your saved items, messages, and history follow you.
  - heading "Honest money" [level=3]
  - paragraph: A double-entry ledger behind every payment, tax itemized, receipts that name the legal entity. No hidden fees — the fee line is a feature, not a confession.
  - heading "One conversation spine" [level=3]
  - paragraph: Buyer to seller, candidate to employer, client to team — the same messaging engine with the same safety rules everywhere.
  - heading "Your language" [level=3]
  - paragraph: Twelve locales, one product. Prices in your currency, not ours.
  - paragraph: We send less, so it matters. Choose your topics — change or unsubscribe any time.
