  - paragraph: "Henry Onyx is one connected economy: care, marketplace, jobs, learning, logistics, creative studio, and property on a single account, wallet, and conversation spine. It is operated by Henry Onyx Limited, a private company registered in Nigeria, and built on a simple rule — the page and the product are the same thing."
