- main:
  - paragraph: From the founder
  - heading "V3 is live" [level=1]
  - paragraph: "The version of Henry Onyx we set out to build: one connected economy you can walk through in five minutes, with every claim linked to the live product."
  - paragraph: V3 is not a redesign. It is the point where the divisions stop being separate products and start being one economy — one identity that signs in everywhere, one wallet with honest double-entry money behind it, one conversation spine carrying buyer to seller, candidate to employer, client to team.
  - paragraph: "We published the parts most platforms keep private: what's actually live, how we earn and why every fee must pass three public tests, and a journey you can take as a stranger without an account. If a page and the product ever disagree, one of them is wrong and we fix it."
  - paragraph: This is the foundation. What comes next earns its place on these pages the same way everything here did — by being real first.
  - paragraph: Henry Chukwuemeka
  - paragraph: Founder, Henry Onyx
