  - paragraph: Company overview · v1.0
  - heading "About Henry Onyx" [level=1]
  - paragraph: "Henry Onyx is a multi-division operating group founded by Henry Chukwuemeka. Each division — Logistics, Fabric Care, Property, Marketplace, Studio, Jobs, and Learn — runs an independent market under one shared operating standard for KYC, payments, support response, and audit logging. We build the same way across every surface: a single account, one trust signal taxonomy, one settlement currency at checkout, one audit trail per action."
