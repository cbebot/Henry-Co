  - paragraph: What the divisions do
  - heading "Seven divisions, one operating standard" [level=2]
  - paragraph: Each division has a defined market and a defined contract — not a bundle. The list here mirrors the divisions we actually operate, so it stays accurate.
  - heading "Henry Onyx Logistics" [level=3]
  - paragraph: Henry Onyx Logistics handles package pickup, dispatch delivery, same-day and scheduled runs, inter-city readiness, fleet coordination, rider workflows, proof of delivery, pricing governance, and customer tracking through one premium operating surface.
  - link:
    - /url: /#divisions
  - heading "Henry Onyx Fabric Care" [level=3]
  - paragraph: Premium garment care, home cleaning, office cleaning, and pickup delivery with clear booking, dependable timing, and polished follow-through.
  - link:
    - /url: /#divisions
  - heading "Henry Onyx Property" [level=3]
  - paragraph: Henry Onyx Property brings premium rentals, property listings, viewing coordination, owner submissions, managed-property services, and trust-led operations into one editorial, high-conviction platform.
  - link:
    - /url: /#divisions
  - heading "Henry Onyx Marketplace" [level=3]
  - paragraph: Premium multi-vendor commerce with cleaner discovery, stronger trust signals, vendor accountability, and operational clarity across buyers, sellers, and Henry Onyx teams.
  - link:
    - /url: /#divisions
  - heading "Henry Onyx Jobs" [level=3]
  - paragraph: Henry Onyx Jobs brings public hiring, verified candidate profiles, trusted employer onboarding, recruiter pipelines, and internal Henry Onyx hiring into one premium operating system.
  - link:
    - /url: /#divisions
  - heading "Henry Onyx Learn" [level=3]
  - paragraph: Browse structured programs, learn at your own pace, pass short assessments where required, and earn Henry Onyx certificates with a public verification code. Your enrollments and progress also appear in your Henry Onyx account dashboard.
  - link:
    - /url: /#divisions
  - heading "Henry Onyx Studio" [level=3]
  - paragraph: Henry Onyx Studio designs and delivers websites, mobile apps, UI systems, branding, e-commerce, internal tools, and custom software with premium process, milestone visibility, and operational clarity.
  - link:
    - /url: /#divisions
  - paragraph: The operating standard
  - heading "Measurable, not adjectival" [level=2]
  - paragraph: We avoid words like “premium”, “respected”, or “disciplined” without a measurable referent. Here is what the standard means in practice across every division.
  - heading "KYC verified before payout" [level=3]
  - paragraph: Vendors and operators complete NIN + BVN verification (where applicable) and bank-account verification before any payout is released. KYC documents are retained for 5 years under CBN AML/CFT Regulations 2022.
  - heading "Every mutation written to the audit trail" [level=3]
  - paragraph: Owner, staff, and operator actions across the platform write to a structured, tamper-evident audit trail retained for 7 years, so every action can be traced after the fact.
  - 'heading "Support response target: 24h" [level=3]'
  - paragraph: First-response target for non-emergency support is 24 hours during operating days. Time-critical disputes (delivery failure, refund window) route through a dedicated support desk with explicit priority queues.
  - heading "Settlement currency at checkout" [level=3]
  - paragraph: Prices display in the customer's locale currency via FX snapshot at checkout; settlement is recorded in NGN with the displayed currency archived alongside per the multi-currency foundation.
  - heading "Device-risk signals for fraud" [level=3]
  - paragraph: Device-risk signals combine with platform trust flags to suppress abusive sign-ups and flag suspicious order patterns. Trust signals reduce but do not eliminate risk.
  - heading "11 supported locales" [level=3]
  - paragraph: Customer-facing surfaces are available in 11 locales. English is the canonical version in case of conflict.
  - paragraph: Who it serves
  - heading "Three customer types we are built for" [level=2]
  - paragraph: We do not target everyone. The platform is shaped around three groups whose problems the operating standard is designed to solve.
  - heading "End customers" [level=3]
  - paragraph: Buyers, tenants, learners, and service requesters who want one account, predictable response times, and verified vendors.
  - heading "Vendors and operators" [level=3]
  - paragraph: Sellers, landlords, instructors, employers, riders, and care providers who want a clean payout path, verified KYC, and dispute support that resolves rather than stalls.
  - heading "Business and institutional buyers" [level=3]
  - paragraph: Companies that need recurring logistics, employee learning, office care, or studio engagements with documented SLAs and signed contracts.
  - paragraph: Scope honesty
  - heading "What we do not promise" [level=2]
  - paragraph: Honest about scope so the operating standard stays credible. The premium-bar rubric calls for this — silence is not a substitute for clarity.
  - heading "We are not a bank" [level=3]
  - paragraph: We process payments through a PCI-compliant payment processor and route payouts to verified bank accounts. We do not hold deposits, issue credit, or run regulated financial products.
  - 'heading "Property: agent, not party to tenancy" [level=3]'
  - paragraph: Henry Onyx Property coordinates discovery, viewings, and (where engaged) managed-property operations. The tenancy contract is between landlord and tenant unless explicitly signed by Henry Onyx Property in a managed-property capacity.
  - 'heading "Jobs: platform, not employer" [level=3]'
  - paragraph: Henry Onyx Jobs hosts listings and verifies candidate profiles. The employment contract is between employer and candidate; Henry Onyx is not party to the employment relationship.
  - heading "Service availability is operating-hours bound" [level=3]
  - paragraph: Logistics same-day windows and care booking windows depend on operating-hours and rider coverage in the customer's city. Coverage is named, not implied.
