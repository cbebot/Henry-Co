- main:
  - paragraph: For employers
  - heading "Hire with clarity, not chaos." [level=1]
  - paragraph: Post real roles, read applications in one place, move people through shortlist and interviews on visible stages. Employers and posts are reviewed to protect quality on both sides.
  - paragraph: Posting live roles requires an active employer subscription. Candidates always browse for free; the subscription pays for moderation, anti-scam review, and candidate trust signals.
  - link "Start hiring — sign up free":
    - /url: https://account.henryonyx.com/signup?next=https%3A%2F%2Fjobs.henryonyx.com%2Femployer%2Fcompany
  - link "I already have a Henry Onyx account":
    - /url: https://account.henryonyx.com/login?next=https%3A%2F%2Fjobs.henryonyx.com%2Femployer%2Fcompany
  - list:
    - listitem: Verification Manual review — no pay-to-play
    - listitem: Post review Clarity, fairness, fraud checks
    - listitem: Pipeline Visible stages for every applicant
  - paragraph: From first post to first hire
  - list:
    - listitem:
      - text: Step 01
      - heading "Tell us who you are" [level=3]
      - paragraph: Create your company profile with honest basics—what you do, where you hire, and how candidates should expect to hear from you. We use this for verification, not vanity.
    - listitem:
      - text: Step 02
      - heading "Submit your role for review" [level=3]
      - paragraph: "Write the job like you mean it: outcomes, requirements, pay band if you can share it, and how you work (remote, hybrid, on-site). New posts may sit in review briefly while we check for scams and quality."
    - listitem:
      - text: Step 03
      - heading "Run the pipeline in the open" [level=3]
      - paragraph: Applications land in your employer workspace. Shortlist, interview, and decide with stages candidates can see in their own hub—fewer ghosted threads, more trust.
  - paragraph: Why verification exists
  - heading "Real brands. Reviewed posts. No badges for sale." [level=2]
  - paragraph: Candidates deserve to know they are not replying to a fake brand. Verification means a human review of employer intent and profile quality — not a pay-to-play badge. While you are pending, you can still prepare your company record; some posting options unlock once you are verified.
  - paragraph: After you submit a post
  - heading "Moderation explains itself, then gets out of the way." [level=2]
  - paragraph: Moderation checks for clarity, fairness, and fraud patterns. If something needs a fix, we will tell you why. When the role is live, candidates apply with one Henry Onyx profile; you review them in your applicant list and move stages when you are ready.
  - paragraph: Quality over volume
  - heading "We protect the board so serious employers stand out." [level=2]
  - paragraph: "Shared sign-in, saved roles, and application history mean candidates can hold you accountable to the process you publish. That is good for hiring: fewer wasted interviews, more people who actually want the job."
