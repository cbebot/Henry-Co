- main:
  - paragraph: For candidates
  - heading "Build a profile that employers actually trust." [level=1]
  - paragraph: Henry Onyx Jobs uses your profile completeness, uploaded documents, verified skills, and work history to help employers see the real you — not just a name and a CV attachment.
  - link "Start your profile":
    - /url: https://account.henryonyx.com/signup?next=https%3A%2F%2Fjobs.henryonyx.com%2Fcandidate%2Fprofile
  - link "Browse open roles":
    - /url: /jobs
  - link "How we protect candidates":
    - /url: /trust
  - list:
    - listitem: Profile Documents, skills, history
    - listitem: Verification Identity, references, certifications
    - listitem: Privacy You choose what each application sends
  - paragraph: Why candidates trust the board
  - list:
    - listitem:
      - heading "Verified Talent Layer" [level=2]
      - paragraph: Candidate profiles gain visible trust signals only after readiness, identity, and work proof checks line up.
    - listitem:
      - heading "Employer Trust Badges" [level=2]
      - paragraph: Company pages show verification maturity, response discipline, and posting quality instead of generic logos alone.
    - listitem:
      - heading "Candidate Readiness Score" [level=2]
      - paragraph: Profiles translate messy completeness into a recruiter-readable readiness score with actionable gaps.
    - listitem:
      - heading "Recruiter Confidence Surface" [level=2]
      - paragraph: Application cards surface confidence, verification, and moderation context in one calm triage layer.
    - listitem:
      - heading "Internal and External Dual Mode" [level=2]
      - paragraph: Henry Onyx internal hiring and external employer hiring coexist without forcing one compromise model onto both.
  - paragraph: Move forward
  - heading "Start your profile, then apply when you’re ready." [level=2]
  - paragraph: Browsing is free. Saving and applying require one Henry Onyx account so your shortlist and applications stay attached to the right person.
  - link "Create candidate profile":
    - /url: https://account.henryonyx.com/signup?next=https%3A%2F%2Fjobs.henryonyx.com%2Fcandidate%2Fprofile
