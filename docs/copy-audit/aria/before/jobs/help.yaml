  - paragraph: Topics
  - list:
    - listitem:
      - text: "01"
      - heading "How does applying work?" [level=2]
      - paragraph: Open any role, read the full description, then sign in with your Henry Onyx account when you are ready. You will send one application from your candidate profile—cover note, availability, and pay expectations if you choose. After you submit, the role moves into your Applications list with a visible stage (reviewing, shortlisted, interview, and so on). You can always see whether you already applied.
    - listitem:
      - text: "02"
      - heading "What does “saved” or shortlist mean?" [level=2]
      - paragraph: Saving a job is a private bookmark. It does not tell the employer you are interested yet. It keeps the role in your Saved jobs list so you can compare options and come back when you have time to write a strong application.
    - listitem:
      - text: "03"
      - heading "What do the application stages mean?" [level=2]
      - paragraph: Stages are the hiring team’s way of showing progress. “Reviewing” means your application is in the queue. “Shortlisted” usually means you passed an early fit check and they want a closer look or conversation. “Interview” is active conversations. “Offer” and “hired” are self-explanatory; “rejected” closes the lane for that role—we still encourage you to refine your profile and try other fits.
    - listitem:
      - text: "04"
      - heading "What does employer verification mean?" [level=2]
      - paragraph: Verified employers have passed a review of identity and intent—not just a paid badge. If someone is still “pending,” they may be new or mid-review. We still moderate individual posts so a verified label is not a free pass to post anything.
    - listitem:
      - text: "05"
      - heading "Why was my post or employer profile held for review?" [level=2]
      - paragraph: "Usually for quality or safety: unclear job details, mismatch with the company, or patterns that look like spam. Employers get a reason when we need a fix. Candidates see fewer broken or misleading roles as a result."
    - listitem:
      - text: "06"
      - heading "Where do my jobs show up in Henry Onyx?" [level=2]
      - paragraph: Applications, saved roles, and updates all appear in your Henry Onyx account. Jobs is the best place to track your hiring activity, and the account dashboard shows your activity across all Henry Onyx services.
    - listitem:
      - text: "07"
      - heading "Why might WhatsApp updates not arrive?" [level=2]
      - paragraph: Messaging apps sometimes hold or delay messages outside an active conversation window. Email and in-app notifications are always on — contact support if WhatsApp updates are missing.
  - paragraph: Henry Onyx account
  - heading "Jobs activity lives alongside the rest of your account." [level=2]
  - paragraph: Wallet, documents, and other services may live under the same Henry Onyx account. The hub gives you the full picture without bouncing between sites.
