- main:
  - paragraph: Trust & safety
  - heading "Learning records you can rely on." [level=1]
  - paragraph: Enrollments, progress, quizzes, and certificates are recorded and enforced by Henry Onyx — not something a browser can fake. Internal courses stay restricted to the right people; certificates carry a verification code anyone can check.
  - link "Browse the catalog":
    - /url: /courses
  - link "Verify a certificate":
    - /url: /certifications/verify
  - list:
    - listitem: Records Authoritative and tamper-resistant
    - listitem: Access control Scoped to who a course is for
    - listitem: Credentials Downloadable + publicly verifiable
  - paragraph: Three operating standards
  - list:
    - listitem:
      - heading "Enrollment & access" [level=2]
      - paragraph: Starting a course, paying where required, and unlocking lessons happen through secure workflows, and completion is verified against your actual progress — not self-declared.
    - listitem:
      - heading "Internal & assigned training" [level=2]
      - paragraph: Some programs are visible only to invited staff or partners. Those restrictions are enforced the same way as the rest of the academy, every time access is checked.
    - listitem:
      - heading "Certificates & verification" [level=2]
      - paragraph: When you earn a credential, we issue a record you can download and a code third parties can check. That’s the difference between decoration and proof.
  - paragraph: Where to next
  - heading "Verify a credential, or start a program built to be checkable." [level=2]
  - paragraph: Anyone can verify a Henry Onyx certificate from its code — no account required. Learners get the same standard of proof whether the program is public, assigned, or partner-only.
  - link "Verify a certificate":
    - /url: /certifications/verify
  - link "Certificate programs":
    - /url: /certifications
