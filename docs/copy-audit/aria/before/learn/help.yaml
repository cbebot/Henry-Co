- main:
  - paragraph: Help
  - heading "Stuck? We unblock fast." [level=1]
  - paragraph: Send a note about certificates, enrollment, assignments, or billing. Include your course name and account email so we can help without back-and-forth.
  - paragraph: Send a message
  - text: Subject
  - textbox "e.g. Certificate not showing, can’t open lesson…"
  - text: Message
  - textbox "What were you trying to do, what happened instead, and any error text you saw?"
  - button "Send message"
  - paragraph: Quick answers
  - list:
    - listitem:
      - heading "How do I continue a course?" [level=3]
      - paragraph:
        - text: Open
        - link "Learn → Active":
          - /url: https://account.henryonyx.com/learn?panel=active
        - text: in your Henry Onyx account, or go back to the course page and open your learning room.
    - listitem:
      - heading "When do I get a certificate?" [level=3]
      - paragraph:
        - text: Only some courses award one. Finish every required lesson and meet any quiz rules; your learning room shows a checklist. Then download from the room or view under
        - link "Certificates":
          - /url: https://account.henryonyx.com/learn?panel=certificates
        - text: in your account.
    - listitem:
      - heading "Can my manager assign training?" [level=3]
      - paragraph: Yes. Assigned programs appear in your account under Learn → Assignments while you complete them in the usual learning room.
  - link "Open Learn in account":
    - /url: https://account.henryonyx.com/learn
