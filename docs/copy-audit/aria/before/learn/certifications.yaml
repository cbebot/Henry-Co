- main:
  - paragraph: Verified certificates
  - heading "Credentials you can show. Anyone can verify." [level=1]
  - paragraph: Certificate-eligible courses carry a badge. Finish the required lessons, pass any assessments, and Henry Onyx Learn records the completion. You get a downloadable PDF plus a public verification code for employers, clients, and partners.
  - list:
    - listitem: Format Downloadable PDF + public link
    - listitem: Verification Code-checkable, no account needed
    - listitem: Storage Saved on your Henry Onyx account
  - paragraph: How a credential works
  - list:
    - listitem:
      - heading "Who it’s for" [level=3]
      - paragraph: Anyone who completes an eligible program — public learners, assigned staff, or partners — holds the same standard of proof.
    - listitem:
      - heading "What “qualified” means" [level=3]
      - paragraph: Requirements are set per course (lessons + sometimes a passing assessment). Your learning room shows a simple checklist until everything is satisfied.
    - listitem:
      - heading "After you earn it" [level=3]
      - paragraph: Add it to your CV or profile, share the verification link, or keep it in your Henry Onyx account alongside the rest of your learning history.
  - paragraph: Verify someone’s certificate
  - heading "Enter the code, see whether the record matches." [level=2]
  - paragraph: Enter the code printed on their credential. You’ll see whether Henry Onyx Learn has a matching, active record — no account required to check.
  - textbox "Verification code"
  - button "Verify"
  - paragraph: Certificate programs
  - heading "Courses that currently award a Henry Onyx certificate" [level=2]
  - paragraph: Open any program for the full syllabus, quiz details, and enrollment options.
  - paragraph:
    - text: No certificate-track courses are published in the catalog yet. Browse all programs on the
    - link "course catalog":
      - /url: /courses
    - text: — we’ll label new credentials clearly as they go live.
