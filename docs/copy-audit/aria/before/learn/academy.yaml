- main:
  - paragraph: How Henry Onyx Learn works
  - heading "From interested to finished, in plain steps." [level=1]
  - paragraph: Choose a program, sign in, learn in order, and (where the course includes it) pass a short assessment to unlock your certificate. Assigned training from managers appears in the same place.
  - link "Create account":
    - /url: https://account.henryonyx.com/signup?next=https%3A%2F%2Flearn.henryonyx.com%2Fcourses
  - link "Browse courses":
    - /url: /courses
  - link "Explore paths":
    - /url: /paths
  - term: Categories
  - definition: "0"
  - term: Courses
  - definition: "0"
  - term: Paths
  - definition: "0"
  - term: Instructors
  - definition: "0"
  - paragraph: Three steps
  - list:
    - listitem:
      - text: "01"
      - heading "Discover" [level=3]
      - paragraph: Browse the catalog or a learning path. Each course page lists duration, difficulty, whether there’s a final quiz, and the score you need to pass.
    - listitem:
      - text: "02"
      - heading "Enroll & learn" [level=3]
      - paragraph: Free courses open immediately; paid ones follow our checkout flow. Lessons unlock in sequence so you always know what comes next.
    - listitem:
      - text: "03"
      - heading "Prove & keep" [level=3]
      - paragraph: Finish lessons and any required quiz to earn a certificate where offered. Download a copy anytime; share your verification code so others can confirm it’s real.
  - paragraph: Your dashboard
  - heading "Keep learning and admin in the right place." [level=2]
  - paragraph: The course room on Henry Onyx Learn is where you read lessons, submit quizzes, and download certificates. Your Henry Onyx account shows the big picture — active courses, saved picks, assignments, billing, and teaching status — in one calm overview.
  - link "Open Learn in account":
    - /url: https://account.henryonyx.com/learn
  - paragraph: Want to teach?
  - heading "We take instructor applications seriously." [level=2]
  - paragraph: Share your background and a concrete course proposal. Our team reviews every submission; we may request changes or decline politely. Commercial terms, including any revenue share, are discussed only after approval.
  - link "Apply to teach":
    - /url: /teach
  - link "Certificate programs":
    - /url: /certifications
