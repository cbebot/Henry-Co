- main:
  - text: Instructor applications Manual review Approval not automatic
  - heading "Teach on a platform that protects learners—and your reputation." [level=1]
  - paragraph: Henry Onyx Learn is for practitioners who can design structured programs, explain ideas clearly, and show up professionally. We verify identity and fit before anyone goes live. Your application stays tied to one Henry Onyx account so review, onboarding, and any future commercial relationship stay coherent.
  - paragraph: Free to apply
  - paragraph: Apply at no cost
  - paragraph: Henry Onyx never charges instructors to submit, review, or appeal an application. We earn when learners pay — not before.
  - paragraph: Review window
  - paragraph: Reviewed manually — written response, no automatic decisions
  - paragraph: "Every application receives a written decision: approved, change-request, or decline. No silent rejections."
  - paragraph: Platform commission
  - paragraph: Set by operator — disclosed before any approved instructor publishes
  - paragraph: Commission is deducted at sale and disclosed in the instructor agreement before publishing opens.
  - paragraph: How Henry Onyx Learn treats teaching
  - list:
    - listitem:
      - heading "Quality expectations" [level=2]
      - paragraph: Outlines, outcomes, and respect for learners’ time matter as much as charisma. We decline proposals that look generic, thin, or misaligned with Henry Onyx audiences.
    - listitem:
      - heading "Who sees your work" [level=2]
      - paragraph: Programs may serve the public, internal teams, or partners. We match instructors to the audiences where their expertise is strongest and the business need is clearest.
    - listitem:
      - heading "After you apply" [level=2]
      - paragraph: Submissions are read by academy operations. We may approve, request specific revisions, or decline. Nothing is published until onboarding and content checks are complete.
  - paragraph: Who should apply
  - heading "Experienced people who can teach—not just talk." [level=2]
  - paragraph: "We welcome operators, trainers, and subject-matter experts who already help others succeed: marketplace leads, CX and care specialists, logistics and field managers, digital-skills coaches, and similar roles. You should be comfortable committing to a syllabus, deadlines, and learner support standards."
  - list:
    - listitem:
      - paragraph: Great fit
      - paragraph: Marketplace operators, internal training leads, care/logistics specialists, customer-experience experts, business operators, and practical digital-skills teachers.
    - listitem:
      - paragraph: Verification & review
      - paragraph: We validate your identity against your Henry Onyx profile, read your credentials and samples, and assess whether your proposed course fits our learners and quality bar. Most applications receive a decision or a request for more detail—not instant approval.
    - listitem:
      - paragraph: Revenue & contracts
      - paragraph: Where a program is paid, Henry Onyx may offer revenue share or other instructor compensation. Terms are agreed in writing after approval—they are not promised on this page and vary by program. We never ask for payment to review your application.
  - paragraph: Review stages
  - heading "What happens after you click submit." [level=3]
  - paragraph: There is no automatic “you’re in.” Each stage exists so learners can trust who teaches them—and so you understand what we expect before you invest more time.
  - list:
    - listitem:
      - text: "01"
      - heading "Submitted" [level=4]
      - paragraph: We store your answers, files, and proposal against your Henry Onyx identity so nothing is lost between systems.
    - listitem:
      - text: "02"
      - heading "Under review" [level=4]
      - paragraph: Academy staff assess expertise, topic fit, and whether your outline meets our learner experience standards.
    - listitem:
      - text: "03"
      - heading "Decision" [level=4]
      - paragraph: We approve, ask for targeted changes with written notes, or decline. Silence is not a strategy—you always get a clear, written response.
    - listitem:
      - text: "04"
      - heading "Onboarding" [level=4]
      - paragraph: Approved instructors complete setup steps (access, guidelines, and where relevant commercial paperwork) before teaching publicly.
  - paragraph: Apply
  - heading "Sign in with your Henry Onyx account first." [level=3]
  - paragraph: We only accept teaching applications from verified account holders. That protects applicants, learners, and Henry Onyx from impersonation—and keeps your status visible in one dashboard.
  - link "Sign in and apply":
    - /url: https://account.henryonyx.com/login?next=https%3A%2F%2Flearn.henryonyx.com%2Fteach
