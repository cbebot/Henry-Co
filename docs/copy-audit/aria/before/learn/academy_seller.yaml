- main:
  - paragraph: Seller Academy
  - heading "Become the kind of seller buyers trust" [level=2]
  - paragraph: A focused track for marketplace sellers. Finish verified courses, sell well, and earn a tier that shows on your profile and listings — every tier is derived from real completions and real performance, never self-assigned.
  - text: Seller tier Bronze seller Silver seller Gold seller
  - link "Enrol":
    - /url: https://account.henryonyx.com/signup?next=https%3A%2F%2Flearn.henryonyx.com%2Facademy%2Fseller
  - link "View course":
    - /url: /courses
  - paragraph: How it works
  - list:
    - listitem:
      - text: "01"
      - heading "Learn the craft" [level=3]
      - paragraph: Three verified courses take you from storefront setup to premium operations. Completion is recorded against your enrolment — there is no self-marking.
    - listitem:
      - text: "02"
      - heading "Sell with quality" [level=3]
      - paragraph: Your delivered orders and customer ratings feed your tier alongside your course progress. Consistency is what moves you up.
    - listitem:
      - text: "03"
      - heading "Earn your tier" [level=3]
      - paragraph: Bronze, Silver, and Gold appear on your business profile and your listings, signalling trust to buyers at a glance.
  - paragraph: The Seller Academy track
  - heading "The Seller Academy track" [level=2]
  - paragraph: Complete the track in order — each level builds on the one before.
  - heading "Seller Academy courses are being prepared. Check back shortly." [level=3]
