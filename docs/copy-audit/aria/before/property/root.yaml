  - paragraph: Featured listings
  - heading "Premium homes and workspaces with stronger context before the first viewing." [level=2]
  - paragraph: The featured surface prioritizes better photography, clearer positioning, tighter moderation, and listings with higher-conviction next steps.
  - link "View all listings":
    - /url: /search
  - paragraph: Featured surface · clearing review
  - paragraph: The featured rail is empty by design while inventory clears moderation. New listings are reviewed for quality, owner verification, and trust posture before they’re elevated here.
  - link "Browse all listings":
    - /url: /search
  - link "Submit a property":
    - /url: /submit
  - paragraph: Areas
  - heading "Location pages that explain the market, not just the stock." [level=2]
  - paragraph: Each area surface gives serious renters and buyers the market context, hotspots, and trust rails behind the shortlist.
  - paragraph: Areas opening soon
  - paragraph: Area ledger entries appear once at least one approved listing lands in moderation. Submit a listing to help the area become visible.
  - paragraph: Differentiators
  - heading "Designed to be calmer, tighter, and more operationally serious than a classified board." [level=2]
  - paragraph: These are the product and operations choices that turn the platform into a trust surface, not just a listing dump.
  - list:
    - listitem:
      - text: "01"
      - paragraph: Trust passports on listings
      - paragraph: Each premium listing carries verification, service, and readiness notes that reduce low-information browsing.
    - listitem:
      - text: "02"
      - paragraph: Viewing confidence rails
      - paragraph: The platform treats viewings like staged operations with backup slots, reminders, and agent accountability.
    - listitem:
      - text: "03"
      - paragraph: Managed-property layer
      - paragraph: Listings can move naturally into ongoing trust operations instead of ending at lead capture.
    - listitem:
      - text: "04"
      - paragraph: Editorial listing moderation
      - paragraph: Weak copy and weak media do not go live untouched; Henry Onyx improves the listing surface before release.
  - paragraph: Managed-property services
  - heading "A property platform that continues after marketing, inquiries, and move-in." [level=2]
  - paragraph: Henry Onyx Property is designed to market, qualify, coordinate, and then keep operating selected properties through owner reporting, inspections, maintenance coordination, and ongoing trust services.
  - list:
    - listitem:
      - text: "01"
      - paragraph: Managed Property Trust Services
      - paragraph: Henry Onyx can operate the property after it is listed, occupied, and handed over.
      - list:
        - listitem: Owner reporting
        - listitem: Maintenance coordination
        - listitem: Rent follow-up
        - listitem: Viewing and inspection standards
    - listitem:
      - text: "02"
      - paragraph: Listing Marketing and Positioning
      - paragraph: Sharper presentation, stronger photography direction, and better inquiry conversion.
      - list:
        - listitem: Editorial listing copy
        - listitem: Premium media sequencing
        - listitem: Featured campaign placement
        - listitem: Viewing-prep workflows
    - listitem:
      - text: "03"
      - paragraph: Inquiry and Viewing Operations
      - paragraph: Henry Onyx can handle response sequencing, screening, and viewing scheduling with calmer rigor.
      - list:
        - listitem: Lead triage
        - listitem: Scheduling coordination
        - listitem: Reminder automation
        - listitem: No-show reduction
