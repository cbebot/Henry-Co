  - heading "People behind the listings, viewings, and managed-property follow-through." [level=2]
  - paragraph: The operator layer is visible because premium real estate decisions need stronger coordination than anonymous form handoffs.
  - paragraph: Operator layer publishing soon
  - paragraph: Relationship managers appear here once their profiles are verified. Until then, owner inquiries route directly to the property desk and a manager is assigned during review.
