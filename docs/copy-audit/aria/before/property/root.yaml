- main:
  - text: Vetted listings · Verified owners Inventory under review Henry Onyx Property · Inventory 2026
  - heading "A property platform that respects your time, the listing, and the work that comes after move-in." [level=1]
  - paragraph: Curated rentals, sale inventory, commercial spaces, and managed homes — every listing carries trust notes, a verified owner path, and a structured viewing flow. Intent first, paperwork when you need it.
  - list:
    - listitem:
      - link "01 · Live in it Browse vetted homes for rent or sale Filter by area, price, managed status. Save listings, request viewings, message owners — all from your Henry Onyx account.":
        - /url: /search
    - listitem:
      - 'link "02 · Own it without operating it Managed-property browse Henry Onyx continues to operate selected portfolios after move-in: viewings, screening, maintenance, and owner reporting on one ledger."':
        - /url: /search?managed=1
    - listitem:
      - link "03 · List or steward it Submit a property for review Built for owners and agents. Inquiries land in your Henry Onyx inbox; managed support is available if you want Henry Onyx to handle the operating side.":
        - /url: /submit
