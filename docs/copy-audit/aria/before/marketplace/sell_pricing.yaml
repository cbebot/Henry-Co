- main:
  - paragraph: Seller pricing
  - heading "Clear economics. No hidden fees." [level=1]
  - paragraph: Plan fees, listing fees, featured-slot fees, transaction commission, and payout processing are all stated up front — before you publish inventory, not after.
  - term: Plan tiers
  - definition: "4"
  - term: Trust tiers
  - definition: "5"
  - term: Featured slots
  - definition: Reviewed individually
  - paragraph: Plans at a glance
  - heading "Pick a plan. The price is the headline." [level=2]
  - list:
    - listitem:
      - link "01 Launch New sellers proving trust and delivery reliability. · 15% commission · 2% + NGN 300 · 3 listings Free":
        - /url: /account/seller-application/start?plan=launch
        - text: 01 Launch
        - paragraph: New sellers proving trust and delivery reliability. · 15% commission · 2% + NGN 300 · 3 listings
        - text: Free
    - listitem:
      - link "02 Growth Verified stores with cleaner operations and more catalog room. · 12% commission · 1.5% + NGN 250 · 20 listings NGN 25,000/month":
        - /url: /account/seller-application/start?plan=growth
        - text: 02 Growth
        - paragraph: Verified stores with cleaner operations and more catalog room. · 12% commission · 1.5% + NGN 250 · 20 listings
        - text: NGN 25,000/month
    - listitem:
      - link "03 Scale High-trust stores running serious volume. · 9% commission · 1% + NGN 250 · 999 listings NGN 85,000/month":
        - /url: /account/seller-application/start?plan=scale
        - text: 03 Scale
        - paragraph: High-trust stores running serious volume. · 9% commission · 1% + NGN 250 · 999 listings
        - text: NGN 85,000/month
    - listitem:
      - link "04 Partner Henry Onyx-managed or strategic partner inventory. · 0% commission · Custom payout terms · 9999 listings Custom":
        - /url: https://henryonyx.com/contact?reason=partnerships&plan=partner
        - text: 04 Partner
        - paragraph: Henry Onyx-managed or strategic partner inventory. · 0% commission · Custom payout terms · 9999 listings
        - text: Custom
  - paragraph: How Henry Onyx makes money
  - heading "Stated up front, deducted in the open." [level=2]
  - list:
    - listitem:
      - text: "01"
      - paragraph: Transaction commissions are deducted from each vendor order-group settlement before payout release.
    - listitem:
      - text: "02"
      - paragraph: Posting fees apply after the included listing allowance is exhausted for the seller's active plan.
    - listitem:
      - text: "03"
      - paragraph: Featured placement is a separate paid request and stays subject to quality and trust review.
    - listitem:
      - text: "04"
      - paragraph: Payout processing fees are deducted inside the seller settlement snapshot, not later by surprise.
    - listitem:
      - text: "05"
      - paragraph: Studio, Learn, and Logistics value-added services create additional seller revenue lanes.
    - listitem:
      - text: "06"
      - paragraph: Operator-controlled campaigns and sponsored slots remain auditable and not self-serve chaos.
  - paragraph: Trust-tier payout timing
  - heading "Better behaviour earns shorter holds." [level=2]
  - list:
    - listitem:
      - text: 01 Unverified
      - paragraph: Up to 8 active listings, strict moderation, no premium high-risk category access, longest payout reserve.
      - text: 10-day payout reserve, 5-day auto-release after verified delivery.
    - listitem:
      - text: 02 Basic verified
      - paragraph: Up to 30 active listings, standard moderation, growth plan economics, featured placement only after clean history.
      - text: 7-day payout reserve, 4-day auto-release after verified delivery.
    - listitem:
      - text: 03 Trusted seller
      - paragraph: Up to 90 active listings, high-risk category access, featured placement eligibility, lighter moderation unless risk spikes.
      - text: 4-day payout reserve, 3-day auto-release after verified delivery.
    - listitem:
      - text: 04 Premium verified business
      - paragraph: Up to 250 active listings, stronger merchandising access, faster payout posture, stronger trust badge treatment.
      - text: 2-day payout reserve, 2-day auto-release after verified delivery.
    - listitem:
      - text: 05 Henry Onyx verified partner
      - paragraph: Partner inventory terms, direct placement controls, lowest payout friction, top trust passport treatment.
      - text: 1-day payout reserve, 1-day auto-release after verified delivery.
  - heading "Application opens in your Henry Onyx account." [level=2]
  - paragraph: You can save the draft and return — pricing visible here applies once vendor onboarding completes.
  - link "Apply as seller":
    - /url: /account/seller-application
