- main:
  - main:
    - paragraph: Protected commerce
    - heading "Buyer Protection Policy" [level=1]
    - paragraph: Henry Onyx receives your payment first, holds it through fulfillment, and can hold the seller's payout when delivery proof is missing or a dispute is open.
    - link "Back to trust standards":
      - /url: /trust
    - text: ·
    - link "Open support thread":
      - /url: /help
    - list:
      - listitem: Coverage Buyers
      - listitem: Enforcement Server-held payments + dispute freeze
      - listitem: Updated On payment + dispute revisions
    - paragraph: Policy provisions
    - list:
      - listitem:
        - text: "01"
        - paragraph: Henry Onyx holds your payment until your order is delivered and confirmed.
      - listitem:
        - text: "02"
        - paragraph: An open dispute holds the seller's payout on the affected order until it is resolved.
      - listitem:
        - text: "03"
        - paragraph: Verified delivery plus timeout can trigger payout release when buyers do not confirm promptly and no dispute exists.
    - paragraph: Connected marketplace controls
    - list:
      - listitem:
        - link "Studio launch services Sellers can buy Henry Onyx Studio help for storefront setup, product photography, creative assets, conversion copy, and merchandising refreshes. Open":
          - /url: https://studio.henryonyx.com/services
          - heading "Studio launch services" [level=3]
          - paragraph: Sellers can buy Henry Onyx Studio help for storefront setup, product photography, creative assets, conversion copy, and merchandising refreshes.
          - text: Open
      - listitem:
        - link "Learn seller academy Seller coaching routes into Learn so onboarding, moderation hygiene, and trust readiness can materially improve seller performance. Open":
          - /url: https://learn.henryonyx.com/courses/marketplace-seller-academy
          - heading "Learn seller academy" [level=3]
          - paragraph: Seller coaching routes into Learn so onboarding, moderation hygiene, and trust readiness can materially improve seller performance.
          - text: Open
      - listitem:
        - link "Logistics verification Delivery proof, tracking confidence, and payout-release evidence can route through Henry Onyx Logistics where supported. Open":
          - /url: https://logistics.henryonyx.com/track
          - heading "Logistics verification" [level=3]
          - paragraph: Delivery proof, tracking confidence, and payout-release evidence can route through Henry Onyx Logistics where supported.
          - text: Open
