- main:
  - main:
    - region "Track a shipment.":
      - text: Visibility · Milestones · Proof
      - heading "Track a shipment." [level=1]
      - paragraph: Use your tracking code with the sender or recipient phone number for secure lookup. Signed-in customers also see logistics activity inside their shared Henry Onyx account.
      - link "Book a delivery":
        - /url: /book
      - link "Request a quote":
        - /url: /quote
      - link "Account logistics hub":
        - /url: https://account.henryonyx.com/logistics
      - list "Live capability evidence":
        - listitem: Active zones 4 Live coverage today
        - listitem: Lookup security Phone-bound Code + phone, never code alone
        - listitem: Visibility Customer-only events Only milestones you can act on
        - listitem: Proof model Recipient + time Africa/Lagos
    - region "Tracking code + phone.":
      - text: Look up a shipment
      - heading "Tracking code + phone." [level=2]
      - text: Both fields required for secure lookup Tracking code
      - textbox "Tracking code":
        - /placeholder: HCL-XXXXXX
      - text: Sender or recipient phone
      - textbox "Sender or recipient phone":
        - /placeholder: +234…
      - button "View status"
      - link "Account logistics hub":
        - /url: https://account.henryonyx.com/logistics
      - text: ·
      - link "Contact support":
        - /url: /support
    - region "What you see, and why we built it this way.":
      - text: The tracking contract
      - heading "What you see, and why we built it this way." [level=2]
      - list:
        - listitem:
          - heading "Customer-visible milestones only" [level=3]
          - paragraph: We show the delivery milestones that matter to you — not internal operational chatter.
        - listitem:
          - heading "Lookup is phone-bound" [level=3]
          - paragraph: The recipient or sender phone authorises the read, so codes alone do not leak shipment data.
        - listitem:
          - heading "Live position when shared" [level=3]
          - paragraph: The map shows live location once it is available. Until then, pickup and dropoff pins anchor the route.
