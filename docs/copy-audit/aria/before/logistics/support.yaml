- main:
  - main:
    - paragraph: One desk · One thread
    - heading "Logistics support, all in one place." [level=1]
    - paragraph: Shipment exceptions, billing questions, routing changes — contact the logistics support team directly. If you have an account, start your message from the logistics area so your delivery history stays with the conversation.
    - link "Open a tagged thread":
      - /url: https://account.henryonyx.com/support
    - link "Email dispatch":
      - /url: mailto:logistics@henryonyx.com
    - link "Track first":
      - /url: /track
    - complementary:
      - paragraph: Direct channels
      - list:
        - listitem:
          - text: Email
          - link "logistics@henryonyx.com":
            - /url: mailto:logistics@henryonyx.com
        - listitem:
          - text: WhatsApp
          - link "WhatsApp":
            - /url: https://wa.me/2349133957084
        - listitem: Hours Mon - Sat • 7:00 AM to 8:00 PM
        - listitem: Operations Enugu, Enugu
    - paragraph: What helps us help you faster
    - list:
      - listitem:
        - heading "Tracking code first" [level=2]
        - paragraph: Every dispatched shipment carries a code (HCL-XXXXXX). Open with the code and the rest of the context is one lookup away.
      - listitem:
        - heading "Sender or recipient phone" [level=2]
        - paragraph: Used to confirm it's you before we show shipment details, the same check as the public tracking page.
      - listitem:
        - heading "What you observed" [level=2]
        - paragraph: Lane, last status you saw, and the outcome you’re asking for. Skip the apology — just the facts.
    - paragraph: Account vs guest
    - list:
      - listitem:
        - text: Account
        - heading "Threaded history" [level=3]
        - paragraph: Tickets land in the Henry Onyx support center with full lane and milestone context. Replies show up the same way emails would, but with the right shipments attached.
      - listitem:
        - text: Guest
        - heading "Email or phone direct" [level=3]
        - paragraph: Reach dispatch on the channels above. Include the tracking code so we can verify the shipment without asking you to repeat yourself.
    - paragraph: Before you message
    - heading "Most timing questions resolve from the track page." [level=2]
    - paragraph: If the milestone you’re looking for is already there, no thread needed. If it isn’t, this page gets you to the right desk fast.
    - link "Track a shipment":
      - /url: /track
    - link "Account support center":
      - /url: https://account.henryonyx.com/support
