- main:
  - main:
    - paragraph: Pricing
    - heading "Honest from base to final." [level=1]
    - paragraph: Base fee combines your zone with a service rate card; weight, size, urgency, and fragile handling layer on predictably. Final pricing may be confirmed for genuinely exceptional shipments.
    - paragraph: Zones
    - list:
      - listitem:
        - heading "Enugu Urban" [level=3]
        - paragraph: Fast inner-city pickups and drops within the core urban delivery ring.
        - paragraph: Base from
        - paragraph: ₦3,000
        - paragraph: Typical window
        - paragraph: 2–6h
      - listitem:
        - heading "Enugu Outskirts" [level=3]
        - paragraph: Extended metro edges and longer in-state dispatch lanes.
        - paragraph: Base from
        - paragraph: ₦4,500
        - paragraph: Typical window
        - paragraph: 4–10h
      - listitem:
        - heading "Other Igbo States" [level=3]
        - paragraph: Governed inter-city movement across nearby regional lanes.
        - paragraph: Base from
        - paragraph: ₦8,500
        - paragraph: Typical window
        - paragraph: 8–24h
      - listitem:
        - heading "Inter-city Priority" [level=3]
        - paragraph: Priority lane for governed same-day or next-window inter-city fulfillment.
        - paragraph: Base from
        - paragraph: ₦12,000
        - paragraph: Typical window
        - paragraph: 10–36h
    - paragraph: Indicative rate cards
    - paragraph: Amounts are combined with zone base fees during booking. Values shown in NGN.
    - table:
      - rowgroup:
        - row "Service Urgency Base add-on Per kg Fragile":
          - columnheader "Service"
          - columnheader "Urgency"
          - columnheader "Base add-on"
          - columnheader "Per kg"
          - columnheader "Fragile"
      - rowgroup:
        - row "same day standard ₦3,500 ₦450 ₦900":
          - cell "same day"
          - cell "standard"
          - cell "₦3,500"
          - cell "₦450"
          - cell "₦900"
        - row "same day rush ₦5,200 ₦600 ₦1,100":
          - cell "same day"
          - cell "rush"
          - cell "₦5,200"
          - cell "₦600"
          - cell "₦1,100"
        - row "scheduled standard ₦2,800 ₦350 ₦700":
          - cell "scheduled"
          - cell "standard"
          - cell "₦2,800"
          - cell "₦350"
          - cell "₦700"
        - row "dispatch priority ₦4,200 ₦400 ₦850":
          - cell "dispatch"
          - cell "priority"
          - cell "₦4,200"
          - cell "₦400"
          - cell "₦850"
        - row "inter city standard ₦9,000 ₦750 ₦1,300":
          - cell "inter city"
          - cell "standard"
          - cell "₦9,000"
          - cell "₦750"
          - cell "₦1,300"
        - row "business route standard ₦5,000 ₦320 ₦650":
          - cell "business route"
          - cell "standard"
          - cell "₦5,000"
          - cell "₦320"
          - cell "₦650"
