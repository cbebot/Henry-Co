- main:
  - main:
    - paragraph: Services
    - heading "What we move." [level=1]
    - paragraph: Parcels, documents, retail replenishment, operational freight — disciplined pickup, milestone tracking, proof-backed delivery. Mon - Sat • 7:00 AM to 8:00 PM
    - list:
      - listitem:
        - paragraph: Service 01 · Fast lane
        - heading "Same-day delivery" [level=2]
        - paragraph: Fast urban dispatch for urgent packages that still need disciplined handoff and proof.
        - paragraph: Priority pickup, live status flow, and premium closeout.
        - list:
          - listitem: · Rapid pickup windows
          - listitem: · Premium handoff flow
          - listitem: · Delay escalation rules
      - listitem:
        - paragraph: Service 02 · Planned
        - heading "Scheduled delivery" [level=2]
        - paragraph: Planned pickups and dropoffs for teams that want cleaner timing and fewer surprises.
        - paragraph: Booked slots, governed pricing, and visible assignment.
        - list:
          - listitem: · Book future runs
          - listitem: · ETA governance
          - listitem: · Repeat booking support
      - listitem:
        - paragraph: Service 03 · Ops core
        - heading "Internal dispatch operations" [level=2]
        - paragraph: Managed dispatch lanes for teams and partners that need controlled routing and a single accountable queue.
        - paragraph: Queue ownership, rider workflows, and issue playbooks.
        - list:
          - listitem: · Dispatch dashboards
          - listitem: · Rider assignment
          - listitem: · Exception handling
      - listitem:
        - paragraph: Service 04 · Expansion lane
        - heading "Inter-city readiness" [level=2]
        - paragraph: Governed cross-city movement with explicit pricing, lane visibility, and delivery assurance.
        - paragraph: Controlled lane pricing and return-flow visibility.
        - list:
          - listitem: · Lane-based pricing
          - listitem: · Cross-city planning
          - listitem: · Return management
