- main:
  - main:
    - region "Calm last-mile, visible end to end.":
      - text: Pickup · Dispatch · Proof
      - heading "Calm last-mile, visible end to end." [level=1]
      - paragraph: Built for people and businesses that need honest ETAs, clean handoffs, and a customer experience that stays premium when operations get noisy.
      - text: Live in Enugu Urban, Enugu Outskirts, Other Igbo States, and Inter-city Priority
      - link "Book a delivery":
        - /url: /book
      - link "Request a quote":
        - /url: /quote
      - link "Track a shipment":
        - /url: /track
      - paragraph: Mon - Sat • 7:00 AM to 8:00 PM
      - list "Live capability evidence":
        - listitem: Active lanes 4 Across 4 zones
        - listitem: Service tiers 4 Same-day, scheduled, dispatch, inter-city
        - listitem: Fastest window 2–6h Governed by lane confidence
        - listitem: Operating hours 7:00 AM to 8:00 PM Mon - Sat
    - region "One operating model. Honest by design.":
      - text: Why teams switch
      - heading "One operating model. Honest by design." [level=2]
      - paragraph: Governed rate cards, immutable milestones, and one shared account remove the operational debt that quietly erodes premium experiences. Same dispatcher logic for same-day, scheduled, dispatch, and inter-city — same calm proof trail.
      - list:
        - listitem:
          - heading "Who it is for" [level=3]
          - paragraph: Retail replenishment, founder-led brands, professional services, and Henry Onyx divisions that need predictable pickup and delivery at scale.
        - listitem:
          - heading "How tracking works" [level=3]
          - paragraph: Use your tracking code with the sender or recipient phone number for secure lookup.
        - listitem:
          - heading "Proof and accountability" [level=3]
          - paragraph: Milestones write to an immutable event log. Proof-of-delivery is part of the product, not an afterthought.
    - region "Four lane shapes. One promise discipline.":
      - text: Operating lanes
      - heading "Four lane shapes. One promise discipline." [level=2]
      - text: 4 tiers · governed pricing
      - list "Logistics lanes":
        - listitem:
          - text: Fast lane
          - heading "Same-day delivery" [level=3]
          - paragraph: Fast urban dispatch for urgent packages that still need disciplined handoff and proof.
          - text: Promise Priority pickup, live status flow, and premium closeout.
        - listitem:
          - text: Planned
          - heading "Scheduled delivery" [level=3]
          - paragraph: Planned pickups and dropoffs for teams that want cleaner timing and fewer surprises.
          - text: Promise Booked slots, governed pricing, and visible assignment.
        - listitem:
          - text: Ops core
          - heading "Internal dispatch operations" [level=3]
          - paragraph: Managed dispatch lanes for teams and partners that need controlled routing and a single accountable queue.
          - text: Promise Queue ownership, rider workflows, and issue playbooks.
        - listitem:
          - text: Expansion lane
          - heading "Inter-city readiness" [level=3]
          - paragraph: Governed cross-city movement with explicit pricing, lane visibility, and delivery assurance.
          - text: Promise Controlled lane pricing and return-flow visibility.
    - region "Every step is visible, every milestone is timestamped.":
      - text: From request to doorstep
      - heading "Every step is visible, every milestone is timestamped." [level=2]
      - list:
        - listitem:
          - heading "Submit a quote or booking" [level=3]
          - paragraph: Two addresses, a parcel profile, and a service tier. Governed pricing returns inline before you commit.
          - text: Step 01
        - listitem:
          - heading "Dispatch assigns the lane" [level=3]
          - paragraph: Routing assigns within the operating window; pickup milestone writes live to your timeline.
          - text: Step 02
        - listitem:
          - heading "Live milestones, both sides" [level=3]
          - paragraph: Sender and recipient see the same events. Updates land via your Henry Onyx account thread.
          - text: Step 03
        - listitem:
          - heading "Proof of delivery, captured" [level=3]
          - paragraph: Recipient name, time, and capture method save to the shipment record — visible on the track page.
          - text: Step 04
    - paragraph: The Henry Onyx posture
    - heading "Operations stay calm because the platform makes it cheaper to do the right thing." [level=2]
    - paragraph: Governed rate cards, immutable milestones, and one shared account remove the operational debt that quietly erodes premium experiences.
    - list:
      - listitem:
        - paragraph: Honest ETAs
        - paragraph: Promise windows come from real lane data, not optimistic guesses. Slippage gets logged and explained.
      - listitem:
        - paragraph: Proof, not promises
        - paragraph: Every handoff writes to an immutable event log. Proof-of-delivery is a product feature, not a ticket attachment.
      - listitem:
        - paragraph: One account, one bill
        - paragraph: Customers reuse the Henry Onyx account they already trust. Operators reconcile in one place across every division.
    - region "The honest answers, before the order.":
      - text: Questions before you book
      - heading "The honest answers, before the order." [level=2]
      - text: Contact Logistics
      - paragraph: If a lane, parcel profile, or contract pricing falls outside the FAQ, the business desk picks it up. Quotes that need a human are not a different product — they live on the same shipment record once they convert.
      - link "Email Logistics":
        - /url: mailto:logistics@henryonyx.com
      - link "Open account hub":
        - /url: https://account.henryonyx.com/logistics
      - term: Can customers request a quote before booking?
      - definition: Yes. Quotes and bookings share the same shipment builder. Quote mode saves the shipment intent, calculates pricing, and stops before payment.
      - term: How is tracking secured?
      - definition: Public tracking uses the tracking code plus the sender or recipient phone number. When you are signed in to your Henry Onyx account, shipments you sent or received also appear automatically.
      - term: What happens when a rider hits an issue?
      - definition: Riders can raise structured issues directly from their workflow. Dispatch and support receive the escalation, and every resolution step is logged back onto the shipment timeline.
      - term: Does the platform support business repeat routes?
      - definition: Yes. The data model and booking flow are built to support repeat addresses, recurring business routing, and future batch submissions.
