- main:
  - main:
    - paragraph: Lane · Service · Profile
    - heading "See the price before you book." [level=1]
    - paragraph: Priced from your lane, service type, and parcel profile. Quotes save with a tracking reference so a booking is one click later — no retyping.
    - paragraph: Indicative · Convertible to booking · No surprise add-ons
    - complementary:
      - paragraph: What the quote shows
      - list:
        - listitem:
          - heading "Lane and service tier" [level=2]
          - paragraph: Standard, express, or scheduled — priced against the actual zones you’re moving between.
        - listitem:
          - heading "Itemised total" [level=2]
          - paragraph: Base fare, weight bands, and any handling — visible before commitment, not at the door.
        - listitem:
          - heading "Promise window" [level=2]
          - paragraph: Honest hour bands with a confidence read, not a single number we can’t hold to.
    - paragraph: Quote details
    - heading "Service" [level=2]
    - paragraph: Pick how fast you need this to move. Pricing updates as you change your selections.
    - text: Zone
    - combobox "Zone":
      - option "Enugu Urban — typical 2–6h" [selected]
      - option "Enugu Outskirts — typical 4–10h"
      - option "Other Igbo States — typical 8–24h"
      - option "Inter-city Priority — typical 10–36h"
