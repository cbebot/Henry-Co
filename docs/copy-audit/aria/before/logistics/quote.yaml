    - text: Type
    - textbox "Type": Parcel
    - text: Weight (kg)
    - spinbutton "Weight (kg)": "1"
    - text: Size
    - combobox "Size":
      - option "Small" [selected]
      - option "Medium"
      - option "Large"
      - option "Oversize"
    - checkbox "Fragile handling"
    - text: Fragile handling Description (optional)
    - textbox "Description (optional)"
    - text: Preferred pickup time (optional)
    - textbox "Preferred pickup time (optional)"
    - paragraph: Indicative pricing is calculated from your zone and parcel profile. Final pricing is confirmed before dispatch.
    - button "Request quote"
    - complementary:
      - paragraph: What happens after you submit
      - list:
        - listitem:
          - text: Step 01
          - heading "Quote returned in one step" [level=3]
          - paragraph: Indicative total and promise window appear in line — no follow-up email needed to see the price.
        - listitem:
          - text: Step 02
          - heading "Reference saved for later" [level=3]
          - paragraph: Each quote stores with a tracking reference. Convert it to a booking from the same form when you’re ready.
        - listitem:
          - text: Step 03
          - heading "Pickup scheduled cleanly" [level=3]
          - paragraph: Booking issues a tracking code and dispatch begins routing within current operating hours.
      - paragraph: Need volume pricing?
      - paragraph: Recurring B2B lanes, multi-stop routes, and contract pricing are handled by our business team — not a quick public quote.
      - link "Talk to the business desk":
        - /url: /business
      - text: ·
      - link "Compare service tiers":
        - /url: /services
    - paragraph: Ready to ship?
    - heading "Convert the quote — we’ll issue a tracking code straight away." [level=2]
    - paragraph: Pricing carries through to the booking with no resets. Milestones write live as pickup and dispatch progress.
