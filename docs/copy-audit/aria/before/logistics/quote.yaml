    - text: Street / building
    - textbox "Street / building"
    - text: City
    - textbox "City"
    - text: State / region
    - textbox "State / region"
    - text: Landmark (optional)
    - textbox "Landmark (optional)"
    - text: Instructions (optional)
    - textbox "Instructions (optional)"
