- main:
  - main:
    - paragraph: Pickup · Dispatch · Proof
    - heading "Book a delivery." [level=1]
    - paragraph: Sender, recipient, and where to meet both sides. Tracking code is issued immediately; milestones update as dispatch progresses.
    - paragraph: Governed pricing · Live milestones · Proof at delivery
    - complementary:
      - paragraph: What we’ll need from you
      - list:
        - listitem:
          - heading "Pickup and dropoff" [level=2]
          - paragraph: Two clean addresses with the right contact name and phone for each end.
        - listitem:
          - heading "Parcel profile" [level=2]
          - paragraph: Weight band, dimensions if oversized, and any handling notes (fragile, cold, document).
        - listitem:
          - heading "Service tier" [level=2]
          - paragraph: Standard, express, or scheduled — pick the timing both sides can hold to.
    - paragraph: Booking details
    - heading "Service" [level=2]
    - paragraph: Pick how fast you need this to move. Pricing updates as you change your selections.
