    - textbox "Landmark (optional)"
    - text: Instructions (optional)
    - textbox "Instructions (optional)"
    - heading "Parcel" [level=2]
    - text: Type
    - textbox "Type": Parcel
    - text: Weight (kg)
    - spinbutton "Weight (kg)": "1"
    - text: Size
    - combobox "Size":
      - option "Small" [selected]
      - option "Medium"
      - option "Large"
      - option "Oversize"
    - checkbox "Fragile handling"
    - text: Fragile handling Description (optional)
    - textbox "Description (optional)"
    - text: Preferred pickup time (optional)
    - textbox "Preferred pickup time (optional)"
    - paragraph: Indicative pricing is calculated from your zone and parcel profile. Final pricing is confirmed before dispatch. Once booked, you receive a tracking code. Payment instructions follow by SMS or email if payment is due.
    - button "Book delivery"
    - complementary:
      - paragraph: After you submit
      - list:
        - listitem:
          - text: Step 01
          - heading "Tracking code on screen" [level=3]
          - paragraph: You see it the moment the booking is recorded — no email wait. Save it or share with the recipient.
        - listitem:
          - text: Step 02
          - heading "Dispatch picks it up" [level=3]
          - paragraph: Routing assigns within the operating window; pickup milestone writes live to the timeline.
        - listitem:
          - text: Step 03
          - heading "Both sides stay informed" [level=3]
          - paragraph: Sender and recipient see the same milestones. Updates land via SMS or in your Henry Onyx account thread.
        - listitem:
          - text: Step 04
          - heading "Proof of delivery on arrival" [level=3]
          - paragraph: Recipient name, time, and capture method save to the shipment record — visible immediately on the track page.
      - paragraph: Recipient privacy
      - paragraph: Phone numbers are used to authorise tracking lookups and surface milestones — not shared with third parties. Both sides can revoke updates from their thread.
    - paragraph: Already have a tracking code?
    - heading "Pick up where the last shipment left off." [level=2]
    - paragraph: Status, proof of delivery, and any active exception live on the track page. Account holders also see logistics activity inside their Henry Onyx support thread.
    - link "Track a shipment":
      - /url: /track
    - link "Get a quote first":
      - /url: /quote
