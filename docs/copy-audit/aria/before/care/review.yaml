- main:
  - paragraph: Verified customer voice
  - heading "Leave a review tied to a real completed booking." [level=1]
  - paragraph: Henry Onyx Fabric Care keeps public feedback genuine and linked to completed bookings. Garment care, home cleaning, and office cleaning clients can all share their experience here.
  - paragraph: What you need
  - list:
    - listitem:
      - paragraph: The booking tracking code.
    - listitem:
      - paragraph: The phone number used on that booking.
    - listitem:
      - paragraph: A service that has already reached its completed stage.
    - listitem:
      - paragraph: An optional photo if you want to show the finished result.
  - paragraph: Verified, not vanity
  - paragraph: Every review is tied to a completed booking. We publish what you write — unedited — and nothing from a booking that never completed.
  - text: Verified client review
  - heading "Leave a verified service review." [level=2]
  - paragraph: Reviews are matched to completed bookings before they appear publicly. Share your tracking code, the phone number used for the booking, and your experience. You can also attach an optional photo of the finished result.
  - textbox "Tracking code"
  - textbox "Booking phone number"
  - text: Rating
  - button "Rating 1"
  - button "Rating 2"
  - button "Rating 3"
  - button "Rating 4"
  - button "Rating 5"
  - textbox "Describe the finish, punctuality, communication, and how the service felt overall."
  - text: Optional service photo
  - paragraph: Add a garment finish photo, room result, or site photo if you want the approved review to feel more vivid.
  - text: Review photo Choose an image Optional. Upload one clear photo of the completed result. JPG, PNG, or WebP under 8MB
  - button "Choose an image Optional. Upload one clear photo of the completed result. JPG, PNG, or WebP under 8MB"
  - button "Submit verified review"
