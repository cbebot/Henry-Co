- main:
  - paragraph: Contact and support
  - heading "One desk. Clear answers." [level=1]
  - paragraph: Booking guidance, schedule changes, billing clarity, or follow-up on an existing service — handled with one consistent thread from first message to final resolution.
  - list:
    - listitem: Service hours Mon - Sat • 8:00 AM to 7:00 PM
    - listitem: Coverage Garment, home, and office requests across covered zones
    - listitem: Follow-up Logged under one reference per request
  - paragraph: Send a message
  - text: Contact Henry Onyx Care
  - heading "Send a message and expect a clear follow-up." [level=2]
  - paragraph: Use this form for booking questions, support follow-up, delivery coordination, recurring plan changes, billing clarification, or any service concern that needs a thoughtful reply.
  - text: Full name • Required
  - textbox "Full name • Required":
    - /placeholder: Your full name
  - text: Email • Required
  - textbox "Email • Required":
    - /placeholder: you@example.com
  - text: Phone number
  - textbox "Phone number":
    - /placeholder: Phone or WhatsApp number
  - text: Preferred contact route • Required
  - combobox "Preferred contact route • Required":
    - option "Email" [selected]
    - option "Phone call"
    - option "WhatsApp"
    - option "Best available route"
  - text: Service category • Required
  - combobox "Service category • Required":
    - option "General question" [selected]
    - option "Garment care"
    - option "Home cleaning"
    - option "Office cleaning"
    - option "Pickup or delivery"
    - option "Billing or payment"
    - option "Recurring plan"
  - text: Subject • Required
  - textbox "Subject • Required":
    - /placeholder: Briefly describe the request
  - text: Urgency • Required
  - combobox "Urgency • Required":
    - option "Routine" [selected]
    - option "Priority"
    - option "Urgent"
  - text: Tracking code
  - textbox "Tracking code":
    - /placeholder: Optional, if the request relates to an existing booking
  - text: Message • Required
  - textbox "Message • Required":
    - /placeholder: Share the context, timing, address or access details, tracking reference, and the specific help you need.
  - text: What happens next Your message is kept under one clear reference. The team replies by email, and by WhatsApp as well when that channel is available. Urgent requests stay visible until the issue has been resolved properly.
  - button "Send to Henry Onyx Care"
