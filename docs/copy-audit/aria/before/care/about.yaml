- main:
  - paragraph: About Henry Onyx Fabric Care
  - heading "Built for disciplined service, not vague promises." [level=1]
  - paragraph: Henry Onyx Care is structured to keep booking, dispatch, execution, and support readable from the first request to the final handoff.
  - link "Book a service":
    - /url: /book
  - link "Contact the team":
    - /url: /contact
  - list:
    - listitem: Service hours Mon - Sat • 8:00 AM to 7:00 PM
    - listitem: Care desk care@henryonyx.com
    - listitem: Service options 6 lines · 6 package plans
  - list:
    - listitem:
      - heading "Garment care" [level=3]
      - paragraph: From daily wardrobe essentials to delicate pieces — cleaning, stain treatment, pressing, finishing, and return delivery handled with precision.
    - listitem:
      - heading "Home cleaning" [level=3]
      - paragraph: Homes are cared for with clear arrival windows, thoughtful service notes, and a finish designed to feel calm, fresh, and genuinely complete.
    - listitem:
      - heading "Office cleaning" [level=3]
      - paragraph: Workplaces receive reliable cleaning support with professional timing, organised site handling, and continuity businesses can count on.
  - heading "Reliable service comes from standards clients can actually feel." [level=2]
  - list:
    - listitem:
      - paragraph: Clear communication before pickup, before arrival, and during every important update.
    - listitem:
      - paragraph: Professional handling for garments, homes, and workplaces with the right context for each service type.
    - listitem:
      - paragraph: Recurring service options that make long-term care easier to manage and easier to trust.
    - listitem:
      - paragraph: One care desk that keeps follow-up documented instead of scattered across channels.
  - heading "Smooth for the client, disciplined behind the scenes." [level=2]
  - list:
    - listitem:
      - text: Step 01
      - heading "Book the right service" [level=3]
      - paragraph: Choose garment care, home cleaning, or office cleaning and share the timing, address, and service notes that matter.
    - listitem:
      - text: Step 02
      - heading "Receive clear confirmation" [level=3]
      - paragraph: You receive confirmation, booking details, payment guidance where relevant, and a tracking code for follow-up.
    - listitem:
      - text: Step 03
      - heading "Service is carried out professionally" [level=3]
      - paragraph: Garments move through pickup and delivery. Homes and offices move through arrival, on-site work, and completion.
    - listitem:
      - text: Step 04
      - heading "Stay informed until the end" [level=3]
      - paragraph: Tracking and email updates keep the next step clear, whether that means return delivery or a completed visit.
  - list:
    - listitem:
      - heading "Pickup and delivery" [level=3]
      - paragraph: Garment care includes controlled pickup, treatment, finishing, and return delivery so customers can follow the order from start to finish.
    - listitem:
      - heading "Quality standards" [level=3]
      - paragraph: Whether the service happens in a wardrobe, a home, or a workplace, the result should feel consistent, careful, and professionally finished.
    - listitem:
      - heading "Convenience without compromise" [level=3]
      - paragraph: Recurring plans, clear updates, and premium support make it easier to keep garments, homes, and workplaces in excellent condition.
  - paragraph: Ready to experience Henry Onyx Fabric Care?
  - heading "Book a premium care service with timing, clarity, and follow-through built in." [level=2]
  - paragraph: From garment pickup and delivery to recurring home and office cleaning, Henry Onyx Fabric Care is built to make dependable service feel easy.
  - link "Book a service":
    - /url: /book
  - link "Explore services":
    - /url: /services
