  - text: Current garment pricing Compose the garment manifest
  - paragraph: Add each garment line cleanly. Quantity, urgency, and treatment stay attached to the same tracking record all the way to return delivery.
  - textbox "Search garments, categories, or care notes"
  - text: 0 of 0 items shown No garment pricing matched this search. Estimated garment quote Selected garment lines Subtotal ₦0 Urgent handling ₦0 Treatment uplift ₦0 Estimated total ₦0 No garment lines selected yet. Add items above to build the manifest. Before you submit Send the garment request and receive one tracking code.
  - paragraph: The team reviews the request after submission. The amount shown here reflects the current estimate based on the details you selected above.
  - button "Book first Selected Send the request now and complete payment after the team confirms the next step. Best when you want the team to review the request first. The booking and tracking flow still opens immediately, and payment instructions remain available afterward." [pressed]:
    - text: Book first Selected Send the request now and complete payment after the team confirms the next step.
    - paragraph: Best when you want the team to review the request first. The booking and tracking flow still opens immediately, and payment instructions remain available afterward.
  - button "Pay now Submit the booking and receive payment details right away. Best when you already know you want the slot confirmed and payment guidance sent by email, with support visibility from the start.":
    - text: Pay now Submit the booking and receive payment details right away.
    - paragraph: Best when you already know you want the slot confirmed and payment guidance sent by email, with support visibility from the start.
  - text: The booking request goes first, and the payment path stays available without adding friction to submission. Your request is reviewed before confirmation, and you can track updates after booking.
