- main:
  - paragraph: Service booking
  - heading "Book a service. One calm form." [level=1]
  - paragraph: Garments move into tracked return delivery. Home and office requests end in on-site completion and sign-off. The form makes the difference clear up front.
  - paragraph: What the request captures
  - list:
    - listitem:
      - heading "Clear request detail" [level=2]
      - paragraph: Service type, address notes, timing, and delivery-vs-on-site context are readable before you submit.
    - listitem:
      - heading "Estimate before submit" [level=2]
      - paragraph: Review the current estimate and payment guidance before the request is sent.
  - paragraph: How a request flows
  - list:
    - listitem:
      - text: Step 01
      - heading "Choose your service type" [level=3]
      - paragraph: Start with garment pickup, home cleaning, or office cleaning, then choose the service options that match the request.
    - listitem:
      - text: Step 02
      - heading "Add the important details" [level=3]
      - paragraph: Add contact details, schedule windows, access notes, and anything that affects delivery or on-site completion.
    - listitem:
      - text: Step 03
      - heading "Receive one tracking code" [level=3]
      - paragraph: You get one tracking code, then follow the correct timeline for return delivery or on-site completion.
  - paragraph: Wardrobe service
  - heading "Garments end in return delivery." [level=3]
  - paragraph: Pickup, treatment, finishing, packing, and return delivery remain visible in their own tracking timeline.
  - paragraph: On-site service
  - heading "Homes and offices end in completed work." [level=3]
  - paragraph: Home and office services focus on scheduling, arrival, service completion, and final sign-off rather than delivery movement.
  - paragraph: Booking truth
  - paragraph: One garment order or one cleaning request stays under one readable tracking code, with payment guidance and follow-up attached to the same record.
  - link "Track an existing request":
    - /url: /track
  - link "Review pricing":
    - /url: /pricing
  - paragraph: Booking form
  - heading "Tell us what the job needs." [level=2]
  - paragraph: Choose the service, add the right details, review the current estimate, and send one clear request.
  - button "Selected Wardrobe care and return delivery Dry cleaning, laundry, pressing, stain treatment, and mixed garment intake under one cleaner customer record that ends in return delivery." [pressed]:
    - text: Selected Wardrobe care and return delivery
    - paragraph: Dry cleaning, laundry, pressing, stain treatment, and mixed garment intake under one cleaner customer record that ends in return delivery.
  - button "Residential or workplace execution One-time or recurring cleaning, site notes, workplace upkeep, and a cleaner quoting flow that ends in completed work, not delivery movement.":
    - text: Residential or workplace execution
    - paragraph: One-time or recurring cleaning, site notes, workplace upkeep, and a cleaner quoting flow that ends in completed work, not delivery movement.
  - text: Service path
  - paragraph: Wardrobe requests are built around pickup, treatment, and return delivery. Home and office requests are built around team arrival, execution, inspection, and confirmed completion.
  - text: Booking details
  - textbox "Customer or contact name"
  - textbox "Primary contact number"
  - textbox "Email for updates and receipts"
  - paragraph: Pickup address
  - textbox "Where we collect your items"
  - paragraph: Pickup is where our team arrives first.
  - paragraph: Return / delivery address
  - checkbox "Same as pickup address"
  - text: Same as pickup address
  - textbox "Where we return cleaned items"
  - paragraph: Return address is where completed items are delivered after treatment.
