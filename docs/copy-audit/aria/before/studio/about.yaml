- main:
  - paragraph: About Henry Onyx Studio
  - heading "A software studio built around clarity, delivery, and trust." [level=1]
  - paragraph: Henry Onyx Studio designs and builds websites, commerce experiences, internal tools, and custom platforms for teams that need serious execution without a chaotic build process.
  - link "Start a brief":
    - /url: /request
  - link "View work":
    - /url: /work
  - term: Services
  - definition: "7"
  - term: Packages
  - definition: "8"
  - term: Teams
  - definition: "4"
  - term: Case studies
  - definition: "3"
  - paragraph: How we operate
  - list:
    - listitem:
      - heading "Structured before creative" [level=2]
      - paragraph: Every project starts with the brief, success criteria, constraints, and delivery path made visible.
    - listitem:
      - heading "Premium execution" [level=2]
      - paragraph: Design, engineering, copy, and launch support move together instead of being treated as separate handoffs.
    - listitem:
      - heading "Client-side confidence" [level=2]
      - paragraph: Milestones, files, invoices, proof uploads, and project messages stay accountable in the Studio workspace.
  - paragraph: Delivery record
  - heading "The studio workspace is part of the service, not an afterthought." [level=2]
  - paragraph: Clients can follow project status, exchange messages, review files, and pay invoices from one controlled workspace.
  - list:
    - listitem: Define whether the request is package-fit or custom from the start.
    - listitem: Capture commercial goals, delivery constraints, features, references, and buyer context.
    - listitem: Route the project to the best-fit Henry Onyx team or team mix.
    - listitem: Send a proposal with scope logic, milestone pricing, and next-step clarity.
    - listitem: Activate the workspace after deposit confirmation and manage delivery through milestones, updates, files, and revisions.
