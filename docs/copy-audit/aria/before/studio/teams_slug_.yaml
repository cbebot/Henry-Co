  - heading "Recent case studies in this lane." [level=2]
  - list:
    - listitem:
      - heading "Service Command Center" [level=3]
      - paragraph: A multi-service operator was running leads, project states, approvals, and finance checkpoints across spreadsheets, chat, and manual reminders.
      - paragraph: Studio replaced the operational sprawl with one command surface that leadership and delivery teams could actually trust.
    - listitem:
      - heading "Premium Reposition Launch" [level=3]
      - paragraph: The company had strong delivery quality, but the public website looked too generic to support bigger contracts and higher confidence inbound sales.
      - paragraph: Studio reframed the company as a premium operator with clearer offers, a more deliberate narrative, and a sharper inquiry path.
    - listitem:
      - heading "Client Portal Rollout" [level=3]
      - paragraph: A service business needed clients to stop relying on email threads for updates, approvals, files, and payment checkpoints.
      - paragraph: Studio introduced a client portal model that made delivery status, assets, and next actions visibly structured.
