- main:
  - paragraph: Teams
  - heading "The people accountable for your build." [level=1]
  - paragraph: Henry Onyx Studio runs four delivery pods — each tuned to a kind of work — backed by a named leadership group that owns scope, quality, and the launch date.
  - paragraph: Studio leadership
  - paragraph: Every project has a named lead from this group. You’ll know who signs off on scope, who answers when something slips, and who is on the hook for launch.
  - list:
    - listitem:
      - article:
        - heading "Henry Chukwuemeka" [level=3]
        - paragraph: Founder & Studio Lead
        - paragraph: Founder of Henry Onyx Sets the studio's standard for clarity, calm delivery, and the discipline behind every milestone.
        - list:
          - listitem: Studio direction
          - listitem: Senior strategy
          - listitem: Final scope sign-off
    - listitem:
      - article:
        - heading "Design & UX Direction" [level=3]
        - paragraph: Lead, Design Pod
        - paragraph: Owns the visual standard across executive websites, commerce, and product UX. Keeps interface language consistent from brief to launch.
        - list:
          - listitem: Brand systems
          - listitem: Interface language
          - listitem: Design QA
    - listitem:
      - article:
        - heading "Engineering Direction" [level=3]
        - paragraph: Lead, Engineering Pod
        - paragraph: Owns architecture, performance, and security across studio builds — from a six-page company site to a multi-role operations platform.
        - list:
          - listitem: Architecture
          - listitem: Performance
          - listitem: Security review
    - listitem:
      - article:
        - heading "Delivery & Client Success" [level=3]
        - paragraph: Lead, Project Delivery
        - paragraph: Owns the milestone calendar, weekly client updates, scope discipline, and the part where launches actually happen on time.
        - list:
          - listitem: Milestone delivery
          - listitem: Client updates
          - listitem: Scope governance
  - paragraph: Delivery pods
  - paragraph: Pick the pod that fits your project, or send the brief and let Studio route you to the right match.
  - list:
    - listitem:
      - article:
        - paragraph: Positioning and Revenue Web Team
        - heading "Orbit Executive Web" [level=2]
        - text: open
        - paragraph: Focused on premium websites, offer architecture, landing systems, and sales surfaces that need to make the business feel more credible immediately.
        - list:
          - listitem: Executive websites
          - listitem: Sales funnels
          - listitem: Premium storytelling
          - listitem: Lead systems
        - list:
          - listitem: Sharp positioning work
          - listitem: High-trust information architecture
          - listitem: Premium conversion polish
        - link "Select this team":
          - /url: /request?team=team-orbit
        - link "Team detail":
          - /url: /teams/orbit
    - listitem:
      - article:
        - paragraph: Software and Operations Team
        - heading "Axis Product Systems" [level=2]
        - text: open
        - paragraph: Best suited to operations platforms, portals, multi-role products, and delivery-heavy software that needs architecture discipline as much as interface quality.
        - list:
          - listitem: Operations platforms
          - listitem: Client portals
          - listitem: Custom software
          - listitem: Business operations
        - list:
          - listitem: Serious architecture
          - listitem: Role-aware platform design
          - listitem: Clean operational reporting
        - link "Select this team":
          - /url: /request?team=team-axis
        - link "Team detail":
          - /url: /teams/axis
    - listitem:
      - article:
        - paragraph: Commerce and Retention Team
        - heading "Nova Commerce" [level=2]
        - text: limited
        - paragraph: Specializes in storefront UX, merchandising systems, campaign landing surfaces, and the operational structure around premium e-commerce.
        - list:
          - listitem: Storefronts
          - listitem: Checkout systems
          - listitem: Campaign commerce
          - listitem: Catalog experiences
        - list:
