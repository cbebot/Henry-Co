- main:
  - paragraph: Trust & transparency
  - heading "Confidence at every stage. In writing, in the workspace, in the bank." [level=1]
  - paragraph: Scope clarity, milestone visibility, secure file handling, payment checkpoints, and accountable communication — structured so you always know what is happening and what comes next.
  - paragraph: Four operating principles
  - list:
    - listitem:
      - heading "Protected controls" [level=2]
      - paragraph: Sensitive actions stay behind secure access controls.
    - listitem:
      - heading "Milestone visibility" [level=2]
      - paragraph: Payments and delivery checkpoints stay visible to the client.
    - listitem:
      - heading "Structured proposals" [level=2]
      - paragraph: Every enquiry becomes a formal proposal with clear scope, pricing, and timelines.
    - listitem:
      - heading "Premium quality" [level=2]
      - paragraph: Every surface is designed to feel considered, modern, and worthy of your investment.
  - paragraph: Trust signals
  - heading "What stays visible from brief to bank." [level=2]
  - list:
    - listitem: Real project requests are captured with structured business and scope detail, not a shallow lead form.
    - listitem: Proposals show investment, milestones, delivery logic, and deposit structure in one clear view.
    - listitem: Files, revisions, messages, and approvals can live inside the same delivery surface instead of being scattered.
    - listitem: Access to proposals, files, approvals, and payment steps is protected through secure links and account-aware checks.
    - listitem: Henry Onyx account history is designed to keep proposals, projects, payments, documents, and support context in one place.
  - paragraph: Client confidence
  - heading "What clients actually say." [level=2]
  - list:
    - listitem:
      - paragraph: “Studio made us look like the level of company we were already trying to become. The difference in trust and sales confidence was immediate.”
      - paragraph: Managing Director, Professional Services Firm
    - listitem:
      - paragraph: “The operations platform work mattered just as much as the front-end polish. We finally had one place to track what was happening across the business.”
      - paragraph: Operations Lead, Multi-Service Business
    - listitem:
      - paragraph: “The storefront felt more deliberate, more expensive, and much easier for customers to buy from. That changed how the business was perceived.”
      - paragraph: Founder, Premium Commerce Brand
  - paragraph: Why clients choose Henry Onyx
  - list:
    - listitem:
      - heading "Typical agency flow" [level=3]
      - list:
        - listitem: A vague inquiry form with almost no commercial context.
        - listitem: Pricing hidden inside a private conversation after too much back-and-forth.
        - listitem: Project status scattered across WhatsApp, email, and disconnected files.
    - listitem:
      - heading "Henry Onyx Studio flow" [level=3]
      - list:
        - listitem: A structured buying path for both packages and serious custom work.
        - listitem: Proposal, milestones, updates, and payment checkpoints visible in one connected workspace.
        - listitem: A cleaner delivery model for clients, sales, PM, finance, support, and delivery teams.
