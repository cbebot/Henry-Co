  - paragraph: Choose custom instead when
  - heading "Larger or deeper builds skip the package and go straight to the brief." [level=2]
  - list:
    - listitem: You need a multi-role portal, client workspace, dashboard, or workflow-specific software system.
    - listitem: The project combines web, admin, payments, operations, and automation into one platform.
    - listitem: The product needs mobile, integrations, or a more deliberate architecture path than a package allows.
    - listitem: You want Henry Onyx to scope the exact experience rather than retrofit your needs into a predefined template.
  - paragraph: Move forward
  - heading "Pick a package that fits, or send us the exact brief." [level=2]
  - list:
    - listitem:
      - heading "Typical agency flow" [level=3]
      - list:
        - listitem: A vague inquiry form with almost no commercial context.
        - listitem: Pricing hidden inside a private conversation after too much back-and-forth.
        - listitem: Project status scattered across WhatsApp, email, and disconnected files.
    - listitem:
      - heading "Henry Onyx Studio flow" [level=3]
      - list:
        - listitem: A structured buying path for both packages and serious custom work.
        - listitem: Proposal, milestones, updates, and payment checkpoints visible in one connected workspace.
        - listitem: A cleaner delivery model for clients, sales, PM, finance, support, and delivery teams.
