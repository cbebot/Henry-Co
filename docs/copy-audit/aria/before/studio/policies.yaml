        - text: Privacy
        - heading "Privacy Policy" [level=2]
        - paragraph: How Henry Onyx Studio collects, uses, stores, and shares personal data — written against the Nigeria Data Protection Act (NDPA) 2023.
        - text: Read in full
    - listitem:
