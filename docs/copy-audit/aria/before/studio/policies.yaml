- main:
  - paragraph: Governance
  - heading "Real agreements. In writing. Before any money moves." [level=1]
  - paragraph: These are the agreements every Henry Onyx Studio engagement runs against. They are not stock templates. They are written against how the platform actually operates — bank transfer in naira, milestone discipline in the portal, NDPA-aligned data handling, and IP transfer on verified final payment. Read them once and they will hold up across every project.
  - text: Last reviewed 2026-05-03 · Governed by Nigerian law
  - list:
    - listitem:
      - link "Terms Terms of Engagement The agreement that governs every Studio project — scope, payments, ownership, change control, and termination. Read in full":
        - /url: /policies/terms
        - text: Terms
        - heading "Terms of Engagement" [level=2]
        - paragraph: The agreement that governs every Studio project — scope, payments, ownership, change control, and termination.
        - text: Read in full
    - listitem:
      - link "Privacy Privacy Policy How Henry Onyx Studio collects, uses, stores, and shares personal data — written against the Nigeria Data Protection Act (NDPA) 2023. Read in full":
