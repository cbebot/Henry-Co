  - paragraph: Engagement
  - heading "Terms run from the moment you reserve." [level=3]
  - paragraph: Reserving a template, accepting a proposal, or paying a deposit is acceptance of the current Terms. The version you accepted is logged in your Client portal.
  - paragraph: Privacy
  - heading "Built to NDPA — minimum data, controlled access." [level=3]
  - paragraph: We collect what we need to deliver the engagement, store it under row-level security, and respect every NDPA right — access, correction, erasure, portability.
  - paragraph: Money
  - heading "Bank transfer to the verified company account." [level=3]
  - paragraph:
    - text: Always to
    - strong: Henry Onyx Limited
    - text: If anyone, internal or external, asks you to pay anywhere else, treat it as fraud and contact finance.
