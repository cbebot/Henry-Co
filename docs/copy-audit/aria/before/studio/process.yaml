- main:
  - paragraph: Process
  - heading "From brief to launch, nothing stays hidden." [level=1]
  - paragraph: Scope, pricing, milestones, payments, and delivery progress stay visible in one structured record from the first brief to final handoff.
  - paragraph: Studio process
  - list:
    - listitem:
      - paragraph: Step 01
      - paragraph: Define whether the request is package-fit or custom from the start.
    - listitem:
      - paragraph: Step 02
      - paragraph: Capture commercial goals, delivery constraints, features, references, and buyer context.
    - listitem:
      - paragraph: Step 03
      - paragraph: Route the project to the best-fit Henry Onyx team or team mix.
    - listitem:
      - paragraph: Step 04
      - paragraph: Send a proposal with scope logic, milestone pricing, and next-step clarity.
    - listitem:
      - paragraph: Step 05
      - paragraph: Activate the workspace after deposit confirmation and manage delivery through milestones, updates, files, and revisions.
  - link "Start a Studio project":
    - /url: /request
