- main:
  - paragraph: NDPA 2023 · v1.0
  - heading "Privacy Policy" [level=1]
  - paragraph: Henry Onyx processes personal data as a data controller under the Nigeria Data Protection Act 2023. This policy names every category of data collected, the lawful basis under NDPA §25, the sub-processors who receive data on the controller's behalf, the retention windows tied to statute, and the rights every data subject can exercise. The canonical version is English; 11 locales are available for reference.
  - link "Exercise your rights":
    - /url: mailto:privacy@henryonyx.com
  - link "Terms and Conditions":
    - /url: /terms
