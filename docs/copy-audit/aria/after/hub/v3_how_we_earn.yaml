- main:
  - paragraph: The earning map
  - heading "How Henry Onyx earns" [level=1]
  - paragraph: For buyers, delivery and any fee appear as named lines before you pay.
  - separator
  - heading "Division by division" [level=2]
  - list:
    - listitem:
      - text: Henry Onyx Marketplace
      - paragraph: A commission on completed orders. Approved sellers, protection on card and wallet payments, order tracking, and a dispute process.
      - text: Live today
    - listitem:
      - text: Henry Onyx Fabric Care
      - paragraph: Package and service pricing; no separate platform fee today. Every charge is shown before you submit a booking; garment totals are confirmed at intake.
      - text: Live today
    - listitem:
      - text: Henry Onyx Learn
      - paragraph: Instructor terms are agreed case by case after approval. Free previews before you pay, and shareable certificates.
      - text: Live today
    - listitem:
      - text: Henry Onyx Studio
      - paragraph: A project fee on commissioned creative work. A shared workspace. A deposit to start, then milestone payments as work is delivered.
      - text: Live today
    - listitem:
      - text: Henry Onyx Jobs
      - paragraph: Candidates never pay to apply. Employer plans are not charged yet. Real conversations with employers, application status you can see, interview scheduling.
      - text: Not charged yet
    - listitem:
      - text: Henry Onyx Logistics
      - paragraph: A margin on each shipment. Up-front quotes and end-to-end tracking.
      - text: Live today
    - listitem:
      - text: Henry Onyx Property
      - paragraph: Listing and management tools for owners and managers. Reviewed property listings.
      - text: Not charged yet
