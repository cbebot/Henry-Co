- main:
  - paragraph: Federal Republic of Nigeria · v1.0
  - heading "Terms and Conditions" [level=1]
  - paragraph: These terms govern access to and use of every Henry Onyx surface and service. They are written under the laws of the Federal Republic of Nigeria, with arbitration seated in Lagos, Nigeria under the Arbitration and Mediation Act 2023. Statute citations are explicit; reject-list phrasing like "in accordance with applicable law" is avoided.
  - link "Privacy Policy":
    - /url: /privacy
  - link "Contact the company":
    - /url: /contact
