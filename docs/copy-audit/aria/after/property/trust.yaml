      - paragraph: Every submission stays private until Henry Onyx reviews and approves it.
    - listitem:
      - heading "Documents first" [level=3]
      - paragraph: A listing still waiting on required documents is not published.
    - listitem:
      - heading "Inspections finished first" [level=3]
      - paragraph: If a listing needs a site inspection, it stays private until the inspection is finished.
    - listitem:
      - heading "Identity and ownership" [level=3]
      - paragraph: A listing can stay in review until the owner's identity or ownership is confirmed.
    - listitem:
      - heading "Owner-run listings" [level=3]
      - paragraph: Listings not managed by Henry Onyx are run by their owner or agent, who remains responsible after first contact.
