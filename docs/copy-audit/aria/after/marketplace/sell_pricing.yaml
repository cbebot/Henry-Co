  - definition: "5"
  - term: Featured slots
  - definition: Reviewed individually
  - paragraph: Plans at a glance
  - heading "Your plan follows your trust tier." [level=2]
  - list:
    - listitem:
      - link "01 Launch New sellers proving trust and delivery reliability. · 15% commission · 2% + NGN 300":
        - /url: /account/seller-application/start?plan=launch
        - text: 01 Launch
        - paragraph: New sellers proving trust and delivery reliability. · 15% commission · 2% + NGN 300
    - listitem:
      - link "02 Growth Verified stores with cleaner operations and more catalog room. · 12% commission · 1.5% + NGN 250":
        - /url: /account/seller-application/start?plan=growth
        - text: 02 Growth
        - paragraph: Verified stores with cleaner operations and more catalog room. · 12% commission · 1.5% + NGN 250
    - listitem:
      - link "03 Scale High-trust stores running serious volume. · 9% commission · 1% + NGN 250":
        - /url: /account/seller-application/start?plan=scale
        - text: 03 Scale
        - paragraph: High-trust stores running serious volume. · 9% commission · 1% + NGN 250
    - listitem:
      - link "04 Partner Henry Onyx-managed or strategic partner inventory. · 0% commission · Custom payout terms":
        - /url: https://henryonyx.com/contact?reason=partnerships&plan=partner
        - text: 04 Partner
        - paragraph: Henry Onyx-managed or strategic partner inventory. · 0% commission · Custom payout terms
  - heading "How fees are charged" [level=2]
  - list:
    - listitem:
      - text: "01"
      - paragraph: Commission and the payout processing fee are both deducted from your settlement.
    - listitem:
      - text: "02"
      - paragraph: Plan subscriptions, posting fees and featured placement are not charged yet.
  - heading "Payout timing by trust tier" [level=2]
  - list:
    - listitem:
      - text: 01 Unverified
      - paragraph: Up to 8 active listings.
      - text: 5-day auto-release after delivery.
    - listitem:
      - text: 02 Basic verified
      - paragraph: Up to 30 active listings, growth plan economics.
      - text: 4-day auto-release after delivery.
    - listitem:
      - text: 03 Trusted seller
      - paragraph: Up to 90 active listings, high-risk category access, featured placement eligibility.
      - text: 3-day auto-release after delivery.
    - listitem:
      - text: 04 Premium verified business
      - paragraph: Up to 250 active listings.
      - text: 2-day auto-release after delivery.
    - listitem:
      - text: 05 Henry Onyx verified partner
      - paragraph: Partner inventory terms.
      - text: 1-day auto-release after delivery.
