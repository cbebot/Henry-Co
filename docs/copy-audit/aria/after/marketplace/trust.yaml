- main:
  - main:
    - paragraph: Trust & safety
    - heading "Visible before checkout. Enforced after it." [level=1]
    - list:
      - listitem:
        - heading "Payments held" [level=2]
        - paragraph: Card and wallet payments are held by Henry Onyx until you confirm delivery or the seller's auto-release window passes.
      - listitem:
        - heading "Disputes" [level=2]
        - paragraph: An open dispute freezes the seller's payout while our team reviews it and arranges any refund.
      - listitem:
        - heading "Cash on delivery" [level=2]
        - paragraph: Cash-on-delivery orders are paid to the rider and are not held.
      - listitem:
        - heading "Approved sellers" [level=2]
        - paragraph: Every store is reviewed and approved by Henry Onyx before it can sell.
